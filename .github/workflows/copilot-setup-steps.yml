name: Copilot Setup Steps

on:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/agents/squad.agent.md
      - .github/skills/**
      - .mcp.json
      - .squad/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - squad.config.ts
  push:
    branches:
      - main
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/agents/squad.agent.md
      - .github/skills/**
      - .mcp.json
      - .squad/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - squad.config.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap local Squad state
        run: pnpm squad:bootstrap

      - name: Validate Squad assets
        run: pnpm squad:check
