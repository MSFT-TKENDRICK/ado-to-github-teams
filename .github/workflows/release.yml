name: Release CLI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CI: true

jobs:
  release-please:
    name: Prepare prerelease
    runs-on: ubuntu-24.04
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Open or update release pull request
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish preview CLI
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag-name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate configuration and scan for secrets
        run: pnpm secrets:check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit

      - name: Contract tests
        run: pnpm test:contract

      - name: Integration tests
        run: pnpm test:integration

      - name: Package smoke test
        run: pnpm package:smoke

      - name: Validate prerelease version
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          tag_name="${{ needs.release-please.outputs.tag-name }}"
          if [[ "$tag_name" != "v${package_version}" ]]; then
            echo "::error::Tag ${tag_name} does not match package version v${package_version}"
            exit 1
          fi
          if [[ "$package_version" != 0.* ]]; then
            echo "::error::Only 0.x.x prerelease versions may be published; received ${package_version}"
            exit 1
          fi
          node scripts/validate-release-versions.mjs

      - name: Package CLI
        id: package
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          npm pack --pack-destination "$release_dir"

          artifact_path="$(find "$release_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          artifact_name="$(basename "$artifact_path")"
          (
            cd "$release_dir"
            sha256sum "$artifact_name" > "${artifact_name}.sha256"
          )

          echo "artifact_path=${artifact_path}" >> "$GITHUB_OUTPUT"
          echo "checksum_path=${artifact_path}.sha256" >> "$GITHUB_OUTPUT"

      - name: Verify packaged CLI
        shell: bash
        run: |
          smoke_dir="$GITHUB_WORKSPACE/node_modules/.release-smoke"
          mkdir -p "$smoke_dir"
          tar --extract --gzip --file "${{ steps.package.outputs.artifact_path }}" --directory "$smoke_dir"
          node "$smoke_dir/package/bin/run.js" --help

      - name: Publish npm package
        run: npm publish "${{ steps.package.outputs.artifact_path }}" --tag preview --provenance

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ado-to-github-teams-${{ github.run_id }}
          path: |
            ${{ steps.package.outputs.artifact_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag-name }}" \
            "${{ steps.package.outputs.artifact_path }}" \
            "${{ steps.package.outputs.checksum_path }}" \
            --clobber
