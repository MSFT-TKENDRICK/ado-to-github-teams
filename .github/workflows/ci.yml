name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'msft-*'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  validate:
    name: Validate CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate configuration and scan for secrets
        run: pnpm secrets:check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit

      - name: Contract tests
        run: pnpm test:contract

      - name: Integration tests
        run: pnpm test:integration

      - name: Migration BDD acceptance gate
        id: bdd
        continue-on-error: true
        run: pnpm test:bdd

      # `if: always()` alone is not enough here: if an earlier required step
      # (e.g. Contract tests) fails, this step - and therefore the BDD step
      # above - is skipped entirely, so reports/cucumber.{ndjson,md} are never
      # written. Without the `steps.bdd.outcome != 'skipped'` guard,
      # `if-no-files-found: error` below would then report a second, unrelated
      # "no files found" failure that obscures the real root cause. The BDD
      # gate itself is still enforced unconditionally by the "Enforce
      # migration BDD gate" step further down.
      - name: Upload migration BDD report
        if: always() && steps.bdd.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: migration-bdd-report
          path: |
            reports/cucumber.ndjson
            reports/cucumber.md
          if-no-files-found: warn
          retention-days: 7

      - name: Publish migration BDD PR comment
        if: >-
          always() &&
          steps.bdd.outcome != 'skipped' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- migration-bdd-report -->'
            const body = fs.readFileSync('reports/cucumber.md', 'utf8')
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      - name: Enforce migration BDD gate
        if: always() && steps.bdd.outcome == 'failure'
        run: exit 1

      - name: Full suite
        run: pnpm test

      - name: Package smoke test
        run: pnpm package:smoke
