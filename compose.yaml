services:
  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    restart: unless-stopped

  nats-init:
    image: natsio/nats-box:0.18.0
    depends_on:
      nats:
        condition: service_healthy
    environment:
      LITESTREAM_NATS_BUCKET: ${LITESTREAM_NATS_BUCKET:-migration_backups}
      WORKFLOW_JETSTREAM_REPLICAS: ${WORKFLOW_JETSTREAM_REPLICAS:-1}
      WORKFLOW_JETSTREAM_MAX_MSGS: ${WORKFLOW_JETSTREAM_MAX_MSGS:-100000}
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        NATS_URL="nats://nats:4222";
        nats --server "$$NATS_URL" object info "$${LITESTREAM_NATS_BUCKET}" >/dev/null 2>&1 ||
        nats --server "$$NATS_URL" object add "$${LITESTREAM_NATS_BUCKET}" --storage=file --replicas="$${WORKFLOW_JETSTREAM_REPLICAS}";
        for stream in ado_github_teams_flows ado_github_teams_steps; do
        nats --server "$$NATS_URL" stream info "$$stream" >/dev/null 2>&1 ||
        nats --server "$$NATS_URL" stream add "$$stream"
        --subjects "$$stream.>" --retention=work --discard=old --storage=file
        --replicas="$${WORKFLOW_JETSTREAM_REPLICAS}" --max-msgs="$${WORKFLOW_JETSTREAM_MAX_MSGS}"
        --max-age=7d --dupe-window=15m --defaults;
        done
    restart: "no"

  worker:
    build:
      context: .
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      PORT: "7331"
      WORKFLOW_API_TOKEN: ${WORKFLOW_API_TOKEN:?WORKFLOW_API_TOKEN must contain at least 32 characters}
      WORKFLOW_TASK_SECRET: ${WORKFLOW_TASK_SECRET:?WORKFLOW_TASK_SECRET must contain at least 32 characters}
      WORKFLOW_SQLITE_PATH: /data/workflow.db
      WORKFLOW_REPORT_DIR: /data/reports
      WORKFLOW_NATS_URLS: nats://nats:4222
      WORKFLOW_BASE_URL: http://worker:7331
      WORKFLOW_INTERNAL_BASE_URL: http://worker:7331
      # Single-host demo: Litestream backs SQLite up to the same NATS node that
      # carries the live queue. That is not failure-independent, so the reduced
      # durability is acknowledged explicitly here. In real production remove the
      # acknowledgement and point LITESTREAM_NATS_URL at an off-host target.
      WORKFLOW_ALLOW_COLOCATED_BACKUP: ${WORKFLOW_ALLOW_COLOCATED_BACKUP:-true}
      # Declare the JetStream posture explicitly instead of inheriting defaults.
      WORKFLOW_JETSTREAM_REPLICAS: ${WORKFLOW_JETSTREAM_REPLICAS:-1}
      WORKFLOW_JETSTREAM_RETENTION: ${WORKFLOW_JETSTREAM_RETENTION:-workqueue}
      WORKFLOW_JETSTREAM_MAX_MSGS: ${WORKFLOW_JETSTREAM_MAX_MSGS:-100000}
      LITESTREAM_CONFIG: /etc/litestream.yml
      LITESTREAM_NATS_URL: ${LITESTREAM_NATS_URL:-nats://nats:4222}
      LITESTREAM_NATS_BUCKET: ${LITESTREAM_NATS_BUCKET:-migration_backups}
      ADO_PAT: ${ADO_PAT:-}
      GH_TOKEN: ${GH_TOKEN:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_FEDERATED_TOKEN_FILE: ${AZURE_FEDERATED_TOKEN_FILE:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
    ports:
      - "7331:7331"
    volumes:
      - workflow-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7331/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  nats-data:
  workflow-data:
