min_version: 2.1.10

pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{cjs,css,html,js,json,jsonc,jsx,md,mjs,scss,ts,tsx,yaml,yml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{cjs,js,jsx,mjs,ts,tsx}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    typecheck:
      run: pnpm typecheck

pre-push:
  commands:
    quality-gate:
      run: pnpm check
